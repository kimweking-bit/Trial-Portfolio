{% extends "siteapp/base.html" %}
{% block title %}Venus | Services{% endblock %}
{% block content %}
<section class="container mx-auto max-w-6xl px-4 py-16">
  <h1 class="text-4xl font-bold mb-8">Services</h1>
  <div class="grid md:grid-cols-3 gap-7">
    {% for item in service_items %}
    <article class="bg-white border rounded-md p-6">
      <h2 class="text-2xl font-bold mb-2">{{ item.title }}</h2>
      <p class="text-grey">{{ item.description }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
